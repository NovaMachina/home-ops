---
# yaml-language-server: $schema=https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-helm/crds/generated/gateway.envoyproxy.io_backendtrafficpolicies.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: unifi-os-server
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unifi-os-server
  # Browser websockets arrive as HTTP/1.1 Upgrade requests. Without this Envoy
  # ALPN-negotiates h2 to UOS's nginx, which can't carry the upgrade and answers 400.
  useClientProtocol: true
