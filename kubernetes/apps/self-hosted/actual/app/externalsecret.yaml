---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: actual-secret
    creationPolicy: Owner
    template:
      data:
        ACTUAL_OPENID_DISCOVERY_URL: "{{ .ACTUAL_OPENID_DISCOVERY_URL }}"
        ACTUAL_OPENID_CLIENT_ID: "{{ .ACTUAL_OPENID_CLIENT_ID }}"
        ACTUAL_OPENID_CLIENT_SECRET: "{{ .ACTUAL_OPENID_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: actual
