---
# yaml-language-server: $schema=https://kubernetes-schemas.jacob-williams.me/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage
  namespace: self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: garage
  targetNamespace: self-hosted
  path: ./kubernetes/apps/self-hosted/garage/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 5m
