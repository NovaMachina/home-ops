---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
# Registration of the persistent runner. Create it first, e.g. in the forgejo pod:
#   forgejo forgejo-cli actions register --name k8s-plugin --scope <org-or-empty> --secret <40 hex chars>
# then store K8S_RUNNER_UUID (from the runners table / `.runner`) and K8S_RUNNER_TOKEN in the `forgejo` 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-runner-k8s-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        uuid: '{{ .K8S_RUNNER_UUID }}'
        token: '{{ .K8S_RUNNER_TOKEN }}'
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
# Rendered as Helm values (HelmRelease valuesFrom) so the cache secret stays out of git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-runner-k8s-values
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        values.yaml: |
          runnerConfig: |
            log:
              level: info
              job_level: info
            runner:
              capacity: 4
              timeout: 3h
              shutdown_timeout: 3m
              fetch_timeout: 5s
              fetch_interval: 2s
              report_interval: 1s
              envs:
                RUNNER_TOOL_CACHE: /opt/hostedtoolcache
              # Prefixed with k8s- so they don't collide with the KEDA runner's labels while testing.
              labels:
                - k8s-docker:k8s:///config/podspec-dind.yaml
                - k8s-base:k8s:///config/podspec-base.yaml
            cache:
              enabled: true
              dir: /data/cache
              port: 8088
              proxy_port: 8089
              external_server: "http://forgejo-runner-cache-server.self-hosted.svc.cluster.local:8088/"
              secret: "{{ .CACHE_SECRET }}"
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            plugins:
              k8s:
                address: "unix:///plugin/forgejo-runner-k8s.sock"
                options:
                  namespace: self-hosted
                  poll_timeout: 10m
                  labels: "app=forgejo-runner-k8s-job"
                  resources: |
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 1Gi
  dataFrom:
    - extract:
        key: forgejo
