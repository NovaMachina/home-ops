---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: forgejo-runner-creds
  namespace: self-hosted
spec:
  secretTargetRef:
    - parameter: token
      name: forgejo-runner-secret
      key: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  labels:
    app: forgejo-runner
  name: forgejo-runner
  namespace: self-hosted
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app: forgejo-runner
      spec:
        volumes:
          - name: runner-data
            emptyDir: {}
          - name: runner-config
            secret:
              secretName: forgejo-runner-config
          - name: runner-registration
            configMap:
              name: runner-registration
          - name: docker-sock
            emptyDir: {}
          - name: runner-cache
            persistentVolumeClaim:
              claimName: forgejo-runner-cache
        restartPolicy: Never
        shareProcessNamespace: true
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        containers:
          - name: runner
            image: code.forgejo.org/forgejo/runner:12.13.2
            command:
              - sh
              - -c
              - |
                while ! [ -S /var/run/docker.sock ]; do
                  echo 'waiting for docker daemon...'
                  sleep 5
                done

                cp /config/.runner /data/.runner

                forgejo-runner -c /registration/registration.yaml one-job
                touch /data/runner-done
            securityContext:
              privileged: true
              runAsUser: 0
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
              - name: docker-sock
                mountPath: /var/run
              - name: runner-data
                mountPath: /data
              - name: runner-registration
                mountPath: /registration
                readOnly: false
              - name: runner-config
                mountPath: /config
                readOnly: false
              - name: runner-cache
                mountPath: /cache
          - name: daemon
            image: docker:29.6.1-dind
            command:
              - sh
              - -c
              - |
                # -G 963 matches the DOCKER_GID baked into the app user's docker
                # group in registry.jacob-williams.me/dev/runner (halsey/containers
                # runners/all/Dockerfile); without it the socket's group won't
                # match what that image expects.
                dockerd-entrypoint.sh -G 963 2>&1 &

                until [ -f /data/runner-done ]; do
                  sleep 5
                  echo "watching main job execution"
                done

                echo "main container exited, stopping dind"
                exit 0
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            securityContext:
              privileged: true
              runAsUser: 0
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 6Gi
            volumeMounts:
              - name: docker-sock
                mountPath: /var/run
              - name: runner-data
                mountPath: /data
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 5
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  triggers:
    - type: forgejo-runner
      metadata:
        name: "runner"
        address: "http://forgejo.self-hosted.svc.cluster.local:3000/"
        global: "true"
        labels: "ubuntu-20,docker,java-25,node-20,node-22,node-26,base-runner,trivy,codeql,runner"
      authenticationRef:
        name: forgejo-runner-creds
