---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-secret
    creationPolicy: Owner
    template:
      data:
        # Postgres init vars
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: forgejo
        INIT_POSTGRES_USER: "{{ .DB_USER }}"
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"

        # Forgejo Config
        FORGEJO__server__ROOT_URL: "https://forgejo.${SECRET_DOMAIN}"
        FORGEJO__server__DOMAIN: "forgejo.${SECRET_DOMAIN}"
        FORGEJO__server__SSH_DOMAIN: "forgejo.${SECRET_DOMAIN}"
        FORGEJO__database__DB_TYPE: postgres
        FORGEJO__database__HOST: postgres16-rw.database.svc.cluster.local:5432
        FORGEJO__database__NAME: forgejo
        FORGEJO__database__USER: "{{ .DB_USER }}"
        FORGEJO__database__PASSWD: "{{ .DB_PASSWORD }}"
        FORGEJO__mailer__ENABLED: "true"
        FORGEJO__mailer__PROTOCOL: "smtps"
        FORGEJO__mailer__USER: "{{ .MG_USERNAME }}"
        FORGEJO__mailer__PASSWD: "{{ .MG_PASSWORD }}"
        FORGEJO__mailer__SMTP_ADDR: "{{ .EMAIL_SERVER }}"
        FORGEJO__mailer__SMTP_PORT: "465"

  dataFrom:
    - extract:
        key: forgejo
    - extract:
        key: mailgun
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        INIT_POSTGRES_SUPER_USER: '{{ .POSTGRES_SUPER_USER }}'
        INIT_POSTGRES_SUPER_PASS: '{{ .POSTGRES_SUPER_PASS }}'
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-runner-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        token: '{{ .RUNNER_TOKEN }}'
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-runner-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        .runner: |
          {
            "WARNING": "This file is automatically generated by act-runner. Do not edit it manually unless you know what you are doing. Removing this file will cause act runner to re-register as a new runner.",
            "id": 2,
            "uuid": "08b14448-0430-40ac-af09-742ffd01a0ec",
            "name": "runner",
            "token": "{{ .RUNNER_CONTAINER_TOKEN}}",
            "address": "http://forgejo.self-hosted.svc.cluster.local:3000/",
            "labels": [
              "docker:docker://registry.jacob-williams.me/ghcr.io/catthehacker/ubuntu:act-latest",
              "node-26:docker://registry.jacob-williams.me/dev/node-runner-26:1.1.0",
              "node-24:docker://registry.jacob-williams.me/dev/node-runner-24:1.1.0",
              "java-25:docker://registry.jacob-williams.me/dev/java-runner-25:1.2.0",
              "trivy:docker://registry.jacob-williams.me/dev/trivy-runner:1.1.1",
              "buildah:docker://registry.jacob-williams.me/dev/buildah-runner:1.1.0",
              "hadolint:docker://registry.jacob-williams.me/dev/hadolint-runner:1.1.0",
              "osv:docker://registry.jacob-williams.me/dev/osv-scanner-runner:1.0.1",
              "checkov:docker://registry.jacob-williams.me/dev/checkov-runner:1.1.0",
              "base-runner:docker://registry.jacob-williams.me/dev/base-runner:1.0.0"
            ]
          }
  dataFrom:
    - extract:
        key: forgejo
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret forgejo-runner-registration
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      data:
        registration.yaml: |-
          log:
            # The level of logging, can be trace, debug, info, warn, error, fatal
            level: info
            # The level of logging for jobs, can be trace, debug, info, earn, error, fatal
            job_level: info

          runner:
            # Where to store the registration result.
            file: .runner
            # Execute how many tasks concurrently at the same time.
            capacity: 1
            # Extra environment variables to run jobs.
            envs:
              A_TEST_ENV_NAME_1: a_test_env_value_1
              A_TEST_ENV_NAME_2: a_test_env_value_2
            # Extra environment variables to run jobs from a file.
            # It will be ignored if it's empty or the file doesn't exist.
            env_file: .env
            # The timeout for a job to be finished.
            # Please note that the Forgejo instance also has a timeout (3h by default) for the job.
            # So the job could be stopped by the Forgejo instance if it's timeout is shorter than this.
            timeout: 3h
            # The timeout for the runner to wait for running jobs to finish when
            # shutting down because a TERM or INT signal has been received.  Any
            # running jobs that haven't finished after this timeout will be
            # cancelled.
            # If unset or zero the jobs will be cancelled immediately.
            shutdown_timeout: 3h
            # Whether skip verifying the TLS certificate of the instance.
            insecure: false
            # The timeout for fetching the job from the Forgejo instance.
            fetch_timeout: 5s
            # The interval for fetching the job from the Forgejo instance.
            fetch_interval: 2s
            # The interval for reporting the job status and logs to the Forgejo instance.
            report_interval: 1s
            # The labels of a runner are used to determine which jobs the runner can run, and how to run them.
            # Like: ["macos-arm64:host", "ubuntu-latest:docker://node:20-bookworm", "ubuntu-22.04:docker://node:20-bookworm"]
            # If it's empty when registering, it will ask for inputting labels.
            # If it's empty when executing the `daemon`, it will use labels in the `.runner` file.
            labels: []

          cache:
            # Enable cache server to use actions/cache.
            enabled: true
            # The directory to store the cache data.
            # If it's empty, the cache data will be stored in $HOME/.cache/actcache.
            dir: "/cache"
            # The host of the cache server.
            # It's not for the address to listen, but the address to connect from job containers.
            # So 0.0.0.0 is a bad choice, leave it empty to detect automatically.
            host: ""
            # The port of the cache server.
            # 0 means to use a random available port.
            port: 8088
            # The port of the cache proxy.
            # 0 means to use a random available port.
            proxy_port: 0
            # The external cache server URL. Valid only when enable is true.
            # If it's specified, it will be used to set the ACTIONS_CACHE_URL environment variable. The URL should generally end with "/".
            # Otherwise it will be set to the the URL of the internal cache server.
            external_server: "http://forgejo-runner-cache-server.self-hosted.svc.cluster.local:8088/"
            # The shared cache secret. When communicating with a cache server, the runner uses this secret to verify the authenticity of the cache requests.
            # When using an external cache server it is required to set the same secret for the runner and the cache server.
            secret: "{{ .CACHE_SECRET }}"
            # Overrides the ACTIONS_CACHE_URL passed to workflow containers. This should only be used if the runner host is not reachable from the
            # workflow containers, and requires further setup.
            actions_cache_url_override: ""

          container:
            # Specifies the network to which the container will connect.
            # Could be host, bridge or the name of a custom network.
            # If it's empty, create a network automatically.
            network: ""
            # Whether to create networks with IPv6 enabled. Requires the Docker daemon to be set up accordingly.
            # Only takes effect if "network" is set to "".
            enable_ipv6: false
            # Whether to use privileged mode or not when launching task containers (privileged mode is required for Docker-in-Docker).
            privileged: false
            # And other options to be used when the container is started (eg, --add-host=my.forgejo.url:host-gateway).
            options:
            # The parent directory of a job's working directory.
            # If it's empty, /workspace will be used.
            workdir_parent:
            # Volumes (including bind mounts) can be mounted to containers. Glob syntax is supported, see https://github.com/gobwas/glob
            # You can specify multiple volumes. If the sequence is empty, no volumes can be mounted.
            # For example, if you only allow containers to mount the `data` volume and all the json files in `/src`, you should change the config to:
            # valid_volumes:
            #   - data
            #   - /src/*.json
            # If you want to allow any volume, please use the following configuration:
            # valid_volumes:
            #   - '**'
            valid_volumes: []
            # overrides the docker client host with the specified one.
            # If "-" or "", an available docker host will automatically be found.
            # If "automount", an available docker host will automatically be found and mounted in the job container (e.g. /var/run/docker.sock).
            # Otherwise the specified docker host will be used and an error will be returned if it doesn't work.
            docker_host: "automount"
            # Pull docker image(s) even if already present
            force_pull: false
            # Rebuild local docker image(s) even if already present
            force_rebuild: false

          host:
            # The parent directory of a job's working directory.
            # If it's empty, $HOME/.cache/act/ will be used.
            workdir_parent:
  dataFrom:
    - extract:
        key: forgejo
