---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teddycloud
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      teddycloud:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/toniebox-reverse-engineering/teddycloud
              tag: latest # TODO: pin to a release tag + digest
            env:
              TZ: America/Chicago
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: teddycloud
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.0.40.52
        ports:
          # Toniebox connects here directly; must stay on 443
          https:
            port: 443
            protocol: TCP
          http:
            port: 80
            protocol: TCP
    route:
      main:
        enabled: true
        hostnames:
          - "teddycloud.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: teddycloud
                kind: Service
                port: 80
    persistence:
      data:
        existingClaim: teddycloud
        advancedMounts:
          teddycloud:
            app:
              - path: /teddycloud/certs
                subPath: certs
              - path: /teddycloud/config
                subPath: config
              - path: /teddycloud/data/content
                subPath: content
              - path: /teddycloud/data/library
                subPath: library
              - path: /teddycloud/data/www/custom_img
                subPath: custom_img
              - path: /teddycloud/data/firmware
                subPath: firmware
              - path: /teddycloud/data/cache
                subPath: cache
              - path: /teddycloud/data/www/plugins
                subPath: plugins
