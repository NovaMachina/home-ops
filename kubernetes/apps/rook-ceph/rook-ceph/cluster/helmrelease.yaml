---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  # Rolling OSD upgrades on this cluster (one OSD at a time, full PG recovery
  # between each) routinely take longer than Helm's 5m default upgrade
  # timeout, which then stalls the HelmRelease (Stalled: RetriesExceeded)
  # even though the underlying CephCluster is still healing fine.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: kube-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        ingressClassName: "internal"
        host:
          name: "rook.${SECRET_DOMAIN}"
          path: "/"
    toolbox:
      # TEMPORARY: enabled to run `ceph health detail` / `ceph auth dump-keys`
      # while verifying the cephx key rotation below. Set back to false once
      # confirmed clean.
      enabled: true
    cephImage:
      # v20.2.3 is NOT an option: once a mon has run v20.2.4 it persists the
      # cephx_auth_aes256k on-disk feature, which a v20.2.3 mon binary
      # refuses to read ("on disk data includes unsupported features").
      # Downgrading past that point crash-loops every mon and drops quorum
      # cluster-wide (confirmed the hard way on 2026-08-23). The
      # AUTH_INSECURE_* HEALTH_ERR this was meant to fix needs a cephx key
      # rotation instead, not a version downgrade.
      repository: quay.io/ceph/ceph
      tag: v21.1.0
    cephClusterSpec:
      security:
        cephx:
          # CVE-2025-30156: Ceph v20.2.4 added the aes256k cephx cipher and
          # flags every daemon/client still on the old `aes` cipher via
          # AUTH_INSECURE_* health checks. Rotate daemon keys (mon/mgr/osd/
          # mds) now - Rook drives the restart itself, no client impact.
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 1
            # csi (and allowedCiphers) intentionally left untouched: aes256k
            # kernel support only landed in Linux 7.0, Talos is on 6.12.57.
            # Rotating CSI node keys now would break every kernel RBD/CephFS
            # mount. Revisit once Talos ships kernel >= 7.0. Do NOT set
            # allowedCiphers to aes256k-only before then - doing so before
            # client.admin/CSI are rotated risks locking out cluster admin
            # access entirely.
      healthCheck:
        # The four checks below are the client/CSI-side half of the same
        # CVE-2025-30156 warning set, deferred until CSI can rotate (see
        # security.cephx comment above). AUTH_INSECURE_SERVICE_KEY_TYPE and
        # AUTH_INSECURE_SERVICE_TICKETS are NOT muted - the daemon rotation
        # above should clear those for real.
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          # Tentacle defaults this to 1, so a single slow op raises
          # BLUESTORE_SLOW_OP_ALERT (clearing 24h later per
          # bluestore_slow_ops_warn_lifetime). Too noisy on healthy SSDs.
          bluestore_slow_ops_warn_threshold: "10" # quote
        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2h
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.monitoring.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            # DISABLED 2026-08-17 as a workaround, NOT a permanent choice.
            # Ceph 20.2.3 prometheus module calls node_proxy_fullreport()
            # (prometheus/module.py:2172), which the Rook orchestrator backend does
            # not implement (orchestrator/_interface.py:363). Each call is recorded
            # as a crash report every 15s until the crash module wedges -> HEALTH_ERR.
            # Disabling makes orch_is_available() false so the call is skipped.
            # RE-ENABLE (set true) once upstream gates get_hardware_metrics() or Rook
            # implements node_proxy_fullreport. Re-check on every Ceph upgrade.
            # Cost while disabled: `ceph orch` + dashboard Hosts/Inventory/Services.
            # NOTE: must stay listed with enabled:false -- Rook only iterates modules
            # present in the spec, so deleting this entry would NOT disable it.
            enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/sdb
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
