---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 30m
  releaseName: ceph-csi-drivers
  chart:
    spec:
      chart: ceph-csi-drivers
      version: "1.0.4"
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: flux-system
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  values:
    # Rook-compatible defaults: driver names must match the provisioner names
    # Rook already uses (see storageclasses in ../cluster/helmrelease.yaml), and
    # the operator namespace prefix must match where the rook-ceph operator runs.
    operatorConfig:
      namespace: rook-ceph # namespace:operator
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com # csi-provisioner-name
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com # csi-provisioner-name
        # Migrated from the old rook-ceph chart's csi.cephFSKernelMountOptions,
        # which was removed from that chart's values schema in v1.20.
        kernelMountOptions:
          ms_mode: prefer-crc
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com # csi-provisioner-name
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com # csi-provisioner-name
