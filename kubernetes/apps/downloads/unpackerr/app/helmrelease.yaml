---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-labs
        namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      unpackerr:
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: 0.16.1
            env:
              UN_SONARR_0_URL: http://sonarr.downloads.svc.cluster.local:8989
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: SONARR_API_KEY
              UN_SONARR_0_PATHS_0: /data/nas-media/downloads/qbittorrent/tv-sonarr
              UN_RADARR_0_URL: http://radarr.downloads.svc.cluster.local:7878
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: RADARR_API_KEY
              UN_RADARR_0_PATHS_0: /data/nas-media/downloads/qbittorrent/radarr
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      media:
        type: nfs
        server: ${SECRET_NFS_SERVER}
        path: /mnt/pool0/Media
        globalMounts:
          - path: /data/nas-media
