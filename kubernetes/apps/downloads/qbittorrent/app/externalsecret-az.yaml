---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wireguard-az-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wireguard-az-secret
    creationPolicy: Owner
  data:
    - secretKey: VPN_PORT_FORWARDING_PROVIDER
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_vpn_service_provider
    - secretKey: UPDATER_VPN_SERVICE_PROVIDERS
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_vpn_service_provider
    - secretKey: WIREGUARD_ENDPOINT_IP
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_vpn_endpoint_ip
    - secretKey: WIREGUARD_PUBLIC_KEY
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_wireguard_public_key
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_wireguard_private_key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: Proton VPN AZ
        property: qbittorrent_wireguard_addresses
    - secretKey: xseed_api_key
      remoteRef:
        key: cross-seed
        property: api_key
    - secretKey: GLUETUN_CONTROL_SERVER_API_KEY
      remoteRef:
        key: gluetun
        property: api_key
